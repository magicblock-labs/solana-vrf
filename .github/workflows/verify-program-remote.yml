name: Verify Program (Remote)

# Asks OtterSec to rebuild the VRF program from its otter-verify PDA, so
# explorers show it as verified. Run it after each mainnet upgrade executes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: magicblock-labs/.github/actions/verify-program-remote@f230947fd85afe668cbea20b94766252a278cc85
        with:
          program-id: Vrf1RNUjXmQGjmQrQLvJHs9SNkvDJEsRVFPkfSQUwGz
